name: Dependency Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-inputs:
    name: Validate scan inputs and synthetic regression fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify committed input inventory
        run: python3 scripts/check_security_inputs.py npm
      - name: Pull immutable OSV 2.5.1 binaries
        run: docker pull ghcr.io/google/osv-scanner-action@sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc
      - name: Test real binary failure boundaries
        run: python3 scripts/tests/test_dependency_scan.py
      - name: Test advisory and strict report boundaries
        run: python3 scripts/tests/test_security_policy.py
      - name: Test fail-closed input and SARIF reporting
        run: node --test scripts/tests/codeql-summary.test.mjs scripts/tests/security-inputs.test.mjs

  osv:
    name: Scan committed dependency locks
    needs: verify-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Pull immutable OSV 2.5.1 binaries
        run: docker pull ghcr.io/google/osv-scanner-action@sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc
      - name: Scan and validate before reporting
        id: scan
        run: python3 scripts/dependency_scan.py npm --advisory
      - name: Upload validated SARIF
        if: ${{ !cancelled() && steps.scan.outputs.report_valid == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: .tmp/dependency-security/results.sarif
          category: .github/workflows/dependency-security.yml:osv-scan
